name: Build Plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出插件源码
        uses: actions/checkout@v4

      - name: 拉取 PotatoVN 宿主源码
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/GoldenPotato137/PotatoVN.git PotatoVN
          if (!(Test-Path "PotatoVN\GalgameManager.WinApp.Base\GalgameManager.WinApp.Base.csproj")) {
            Write-Error "宿主源码结构异常"
            exit 1
          }

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 准备 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 还原依赖
        run: msbuild PotatoVN.App.Plugin.ScrapeControl\PotatoVN.App.Plugin.ScrapeControl.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: 编译并打包
        run: msbuild PotatoVN.App.Plugin.ScrapeControl\PotatoVN.App.Plugin.ScrapeControl.csproj /p:Configuration=Release /p:Platform=x64

      - name: 上传插件包
        uses: actions/upload-artifact@v4
        with:
          name: plugin-pvnplugin
          path: PotatoVN.App.Plugin.ScrapeControl\artifacts\plugin.pvnplugin.zip
          if-no-files-found: error
